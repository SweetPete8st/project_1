name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Purity gate (04 §2 / NFR-8): the entire core must build & test on Linux, and the
  # synthetic corpus must pass every accuracy gate (08 §4 synthetic tier).
  linux-core:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build (strict concurrency)
        run: swift build
      - name: Unit + engine tests
        run: swift test
      - name: Regenerate synthetic corpus
        run: swift run fixture-synth fixtures-ci
      - name: Replay accuracy gates
        run: swift run shred-replay run fixtures-ci --gates --report replay-report.json
      - name: Upload replay metrics
        uses: actions/upload-artifact@v4
        with:
          name: replay-report
          path: replay-report.json

  # App target compiles on macOS (no simulator run in CI at v1; UI tests are M6).
  ios-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app (no signing)
        run: |
          xcodebuild build \
            -project Shred.xcodeproj \
            -scheme Shred \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
